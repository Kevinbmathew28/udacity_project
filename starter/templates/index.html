<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <h1>Sudoku Game</h1>
    <div class="controls top-controls">
      <label for="difficulty-select">Difficulty:</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <label class="theme-switch" for="theme-toggle">
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode"> Dark Mode
      </label>
    </div>
    <div id="timer" aria-live="polite">00:00</div>
    <div class="board-shell">
      <div id="sudoku-board"></div>
    </div>
    <div class="controls action-controls">
      <button id="new-game">New Game</button>
      <button id="check-solution">Check Solution</button>
      <button id="hint-solution">Hint</button>
      <span id="message" role="status"></span>
    </div>
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <h2 id="leaderboard-title">Top 10 Leaderboard</h2>
      <table id="leaderboard-list" class="leaderboard-table" aria-label="Top 10 leaderboard"></table>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
