<doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-container">
    <section class="game-area">
      <h1 class="app-title">Sudoku Game</h1>
      <div id="sudoku-board" class="board-wrapper"></div>
      <div class="controls">
        <div class="controls-left">
          <button id="new-game">New Game</button>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
          <button id="hint-button">Hint</button>
        </div>
        <div class="controls-right">
          <button id="check-solution">Check Solution</button>
          <button id="check-puzzle">Check Puzzle</button>
          <button id="theme-toggle">Dark Mode</button>
          <span id="timer">00:00</span>
        </div>
        <div class="controls-message"><span id="message"></span></div>
      </div>
    </section>

    <aside id="leaderboard" aria-live="polite" class="leaderboard">
      <h2>Top 10 Times</h2>
      <ol id="leaderboard-list"></ol>
    </aside>
  </main>

  <script src="/static/main.js"></script>
</body>
</html>
